name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml
      COMPOSE_PROJECT_NAME: ci-tests
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Create fake env file
        run: cp .env.example .env

      - name: Prepare reports
        run: mkdir -p test-results

      - name: Start production stack
        id: stack
        run: docker compose up --build --wait --wait-timeout 180

      - name: Run all Python tests
        id: python
        run: |
          docker compose run --rm --no-deps --user root \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/test-results:/test-results" \
            --workdir /workspace \
            --env TEST_DATABASE_URL=postgresql+psycopg://cyberaccountant:cyberaccountant@postgres:5432/cyberaccountant \
            --env TEST_REDIS_URL=redis://redis:6379/1 \
            --env OCR_SANDBOX_TESTS=1 \
            --env STORAGE_ROOT=/tmp/test-storage \
            server sh -ec '
              python -m pip install --no-cache-dir "pytest>=8,<10"
              python -m pytest server/tests office_sandbox/tests -ra -p no:cacheprovider \
                --junitxml=/test-results/python.xml
            ' 2>&1 | tee test-results/python.log

      - name: Build production frontend test image
        id: client_build
        if: ${{ !cancelled() }}
        run: docker build --file server/Dockerfile --target client-build --tag client-tests:ci .

      - name: Run all frontend tests
        id: client
        if: ${{ !cancelled() && steps.client_build.outcome == 'success' }}
        run: |
          docker run --rm --volume "$PWD/test-results:/test-results" client-tests:ci \
            sh -ec 'node --experimental-strip-types --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination=/test-results/client.xml \
              tests/*.test.mjs' 2>&1 | tee test-results/client.log

      - name: Report test results
        if: always()
        env:
          STACK_RESULT: ${{ steps.stack.outcome }}
          PYTHON_RESULT: ${{ steps.python.outcome }}
          CLIENT_BUILD_RESULT: ${{ steps.client_build.outcome }}
          CLIENT_RESULT: ${{ steps.client.outcome }}
        run: python3 .github/scripts/test-summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps --all > test-results/compose-status.txt
          docker compose logs --no-color --timestamps > test-results/compose.log 2>&1

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Stop production stack
        if: always()
        run: docker compose down --volumes --remove-orphans
