services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OFFICE_SANDBOX_URL: http://office_sandbox:8001
    depends_on:
      office_sandbox:
        condition: service_healthy
    networks:
      - default
      - office

  office_sandbox:
    build: ./office_sandbox
    init: true
    expose:
      - "8001"
    networks:
      - office
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /work:rw,noexec,nosuid,nodev,size=512m,mode=1777
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  office:
    internal: true
