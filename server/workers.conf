[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:ocr]
command=ocr-worker
autorestart=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:entities]
command=entities-worker
numprocs=5
process_name=%(program_name)s_%(process_num)02d
autorestart=true
stopwaitsecs=30
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
