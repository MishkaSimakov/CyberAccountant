name: cyberaccountant-dev

services:
  server:
    extends:
      file: compose.yaml
      service: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    init: true
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app

  worker:
    extends:
      file: compose.yaml
      service: worker
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app

  entities_worker:
    extends:
      file: compose.yaml
      service: entities_worker
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app

  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    extends:
      file: compose.yaml
      service: redis

  office_sandbox:
    extends:
      file: compose.yaml
      service: office_sandbox

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:8000
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      - client_node_modules:/app/client/node_modules
    depends_on:
      server:
        condition: service_healthy

networks:
  office:
    internal: true

volumes:
  postgres_data:
  redis_data:
  client_node_modules:
  document_data:
