name: cyberaccountant-dev

services:
  server:
    extends:
      file: compose.yaml
      service: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    init: true
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app

  worker:
    extends:
      file: compose.yaml
      service: worker
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app

  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    extends:
      file: compose.yaml
      service: redis

  office_sandbox:
    extends:
      file: compose.yaml
      service: office_sandbox

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://server:8000
      VITE_USE_POLLING: "true"
    volumes:
      - .:/app
      - client_node_modules:/app/client/node_modules
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  office:
    internal: true
  default:
    internal: false

volumes:
  postgres_data:
  redis_data:
  client_node_modules:
  document_data:
